apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: distributed-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: distributed-platform/chat-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/chat_db"
          resources:
            requests: { memory: "256Mi", cpu: "200m" }
            limits: { memory: "768Mi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: distributed-platform
spec:
  selector:
    app: chat-service
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP
